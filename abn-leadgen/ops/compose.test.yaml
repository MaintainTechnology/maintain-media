services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: abr_fixture
      POSTGRES_PASSWORD: abr_fixture
      POSTGRES_DB: abr_fixture
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abr_fixture -d abr_fixture"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [fixture]
networks:
  fixture:
    internal: true
