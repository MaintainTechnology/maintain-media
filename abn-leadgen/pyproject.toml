[project]
name = "abn-leadgen"
version = "0.1.0"
description = "Maintain Media controlled lead qualification engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.16", "pydantic>=2.11", "pyyaml>=6", "psycopg[binary]>=3.2",
  "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "pyjwt>=2.10",
  "cryptography>=45", "duckdb>=1.3", "pyarrow>=20", "lxml>=5.4",
  "defusedxml>=0.7", "beautifulsoup4>=4.13", "protego>=0.4",
  "phonenumbers>=9", "tldextract>=5.3", "jinja2>=3.1", "psutil>=7", "tzdata>=2025.2",
]
[project.scripts]
abr-engine = "abr_engine.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/abr_engine"]
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "types-PyYAML", "types-requests", "types-psutil"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
