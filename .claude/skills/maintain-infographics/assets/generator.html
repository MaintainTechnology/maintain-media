<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maintain Audits — Infographic Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- Maintain Audits "Assurance" system (mirrors design-system/tokens.css) ---- */
  :root{
    --forge:#07272D; --black:#101820; --green:#3DDC84; --green-deep:#157A40; --signal:#06F285;
    --cloud:#F5F5F1; --white:#fff; --ink:#1F2D2B;
    --grid:rgba(61,220,132,.05);
    --display:'Albert Sans',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0f12;font-family:var(--body)}
  #deck{display:flex;flex-wrap:wrap;gap:24px;padding:24px}

  .stage{
    position:relative;overflow:hidden;flex:none;
    /* tone-aware text/accent vars — flipped by [data-tone="light"] */
    --fg:#fff; --fg-muted:rgba(255,255,255,.74); --fg-faint:rgba(255,255,255,.55);
    --accent:var(--green); --line:rgba(255,255,255,.14); --card:rgba(255,255,255,.03);
    --scrim:linear-gradient(180deg, rgba(7,39,45,.5) 0%, rgba(7,39,45,.12) 38%, rgba(7,39,45,.72) 100%);
    background-color:var(--forge);
    background-image:
      radial-gradient(60% 55% at 78% 6%, rgba(61,220,132,.20), transparent 60%),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:auto, 44px 44px, 44px 44px;
    color:var(--fg);
    display:flex;flex-direction:column;padding:96px 88px;
  }
  .stage[data-tone="light"]{
    --fg:#07272D; --fg-muted:#3f5150; --fg-faint:#64748B;
    --accent:var(--green-deep); --line:rgba(7,39,45,.16); --card:rgba(7,39,45,.035);
    --scrim:linear-gradient(180deg, rgba(245,245,241,.62) 0%, rgba(245,245,241,.22) 38%, rgba(245,245,241,.8) 100%);
  }
  /* full-bleed graphic background from the assets/graphics library */
  .stage.has-bg{ background-repeat:no-repeat; background-position:center; background-size:cover; }
  .stage.has-bg::before{ content:""; position:absolute; inset:0; background:var(--scrim); z-index:0; }
  .stage.has-bg > *{ position:relative; z-index:1; }
  .stage::after{content:"";position:absolute;inset:0;border:1px solid var(--line);pointer-events:none;z-index:2}

  .brandbar{display:flex;align-items:center;justify-content:space-between;gap:24px}
  .brandbar .wm{height:34px;color:var(--fg)}
  .kicker{font-family:var(--body);font-weight:600;font-size:24px;color:var(--accent);letter-spacing:.01em}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .footer{display:flex;align-items:center;justify-content:space-between;color:var(--fg-faint);font-size:22px}
  .footer .idx{font-variant-numeric:tabular-nums}

  h1,.headline{font-family:var(--display);font-weight:800;letter-spacing:-.02em;line-height:1.03;text-wrap:balance;color:var(--fg)}
  .headline{font-size:76px;max-width:16ch}
  .cover-h{font-size:96px;max-width:15ch}
  .sub{color:var(--fg-muted);font-size:30px;line-height:1.4;margin-top:24px;max-width:26ch}

  /* stat */
  .stat-value{font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:.9;font-size:340px;color:var(--accent)}
  .stat-label{font-family:var(--display);font-weight:700;font-size:64px;line-height:1.05;margin-top:12px;max-width:15ch}
  .stat-note{color:var(--fg-muted);font-size:28px;margin-top:28px;max-width:28ch}

  /* list */
  .cards{display:flex;flex-direction:column;gap:20px;margin-top:44px}
  .card{border:1px solid var(--line);border-radius:14px;padding:32px 34px;background:var(--card)}
  .card-title{font-family:var(--display);font-weight:700;font-size:38px;color:var(--fg)}
  .card-detail{color:var(--fg-muted);font-size:26px;margin-top:8px;line-height:1.4}

  /* steps */
  .steps{display:flex;flex-direction:column;gap:22px;margin-top:44px}
  .step{display:flex;align-items:flex-start;gap:26px}
  .step .n{flex:none;width:60px;height:60px;border-radius:999px;background:var(--green);color:var(--forge);
    font-family:var(--display);font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center}
  .step .t{font-size:34px;line-height:1.25;padding-top:8px;color:var(--fg)}

  /* quote */
  .quote-body{display:flex;flex-direction:column;gap:40px}
  .quote{font-family:var(--display);font-weight:700;font-size:56px;line-height:1.18;letter-spacing:-.01em;text-wrap:balance;color:var(--fg)}
  .quote::before{content:"\201C";color:var(--accent);font-size:120px;line-height:0;display:block;height:40px}
  .attrib{display:flex;align-items:center;gap:26px}
  .avatar{width:104px;height:104px;border-radius:999px;flex:none;
    background:radial-gradient(120% 120% at 30% 20%, var(--signal), #0b6b3a 90%);
    background-size:cover;background-position:center}
  .attrib .who{font-family:var(--display);font-weight:700;font-size:34px;color:var(--fg)}
  .attrib .role{color:var(--fg-muted);font-size:26px;margin-top:4px}

  /* cta */
  .cta-btn{display:inline-flex;align-items:center;gap:16px;align-self:flex-start;margin-top:44px;
    background:var(--green);color:var(--forge);font-family:var(--body);font-weight:700;font-size:34px;
    padding:26px 44px;border-radius:12px}
  .cta-btn svg{width:30px;height:30px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .cta-url{color:var(--accent);font-size:30px;margin-top:32px;font-weight:600}

  /* cover */
  .cover-body{justify-content:flex-end}
</style>
</head>
<body>
<div id="sprite" hidden></div>
<div id="deck"></div>
<script>
/* Default deck so the engine renders standalone; render.mjs overrides window.DECK. */
window.DECK = window.DECK || {
  size:"1080x1350", handle:"maintainaudits.com.au",
  slides:[
    { type:"cover", bg:"cover", eyebrow:"Franchise assurance", headline:"The audit force behind Australia's franchise networks" },
    { type:"stat", bg:"green-gradient", value:"48hr", label:"From engagement to report", note:"Independent franchise assurance." },
    { type:"list", headline:"Three types of franchise risk", items:[
      { title:"Revenue risk", detail:"Lost income from non-compliant sites." },
      { title:"Brand risk", detail:"Erosion of your franchise's core value." },
      { title:"Reputation risk", detail:"The exposure that keeps franchisors up at night." } ] },
    { type:"cta", bg:"section", headline:"Know what is happening in your network", action:"Book a consultation", url:"maintainaudits.com.au" }
  ]
};

/* ---- background graphics catalog (assets/graphics) — every file is addressable ---- */
const BG = {
  "green-gradient":{src:"graphics/web/green-gradient.jpg",tone:"dark"},
  "blue-gradient":{src:"graphics/web/blue-gradient.jpg",tone:"dark"},
  "gradient":{src:"graphics/web/gradient.jpg",tone:"dark"},
  "gradient-portrait":{src:"graphics/web/gradient-portrait.jpg",tone:"dark"},
  "cover":{src:"graphics/web/cover.jpg",tone:"dark"},
  "cover-2":{src:"graphics/web/cover-2.jpg",tone:"dark"},
  "section":{src:"graphics/web/section.jpg",tone:"dark"},
  "mountain-forms-1":{src:"graphics/web/mountain-forms-1.jpg",tone:"dark"},
  "mountain-forms-2":{src:"graphics/web/mountain-forms-2.jpg",tone:"dark"},
  "pantone-glow":{src:"graphics/web/pantone-glow.jpg",tone:"dark"},
  "blu-gradient":{src:"graphics/web/blu-gradient.svg",tone:"dark"},
  "mountain":{src:"graphics/mountain.svg",tone:"dark"},
  "gradient-white":{src:"graphics/web/gradient-white.jpg",tone:"light"},
  "white-bg":{src:"graphics/web/white-bg.jpg",tone:"light"},
  "white-gradient":{src:"graphics/web/white-gradient.jpg",tone:"light"},
  "white-linear":{src:"graphics/web/white-linear.jpg",tone:"light"},
  "mountain-line":{src:"graphics/web/mountain-line.jpg",tone:"light"},
};
function resolveBg(bg){
  if(!bg) return null;
  if(BG[bg]) return BG[bg];
  const src = bg.includes("/") ? bg : `graphics/web/${bg}${bg.includes(".")?"":".jpg"}`;
  return { src, tone:"dark" };
}

const ICON={ arrow:"i-arrow-right" };
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function icon(id){ return document.getElementById(id)?`<svg viewBox="0 0 24 24"><use href="#${id}"/></svg>`:""; }
function wordmark(){ return document.getElementById("wordmark")
  ? `<svg class="wm" viewBox="0 0 440 93" role="img" aria-label="Maintain Audits"><use href="#wordmark"/></svg>`
  : `<span class="wm" style="font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;display:inline-flex;align-items:center;color:var(--fg)">Maintain Audits</span>`; }

function panelBody(s){
  switch(s.type){
    case "cover": return `
      <div class="body cover-body"><div>
        ${s.eyebrow?`<div class="kicker" style="margin-bottom:20px">${esc(s.eyebrow)}</div>`:""}
        <h1 class="headline cover-h">${esc(s.headline)}</h1>
        ${s.sub?`<div class="sub">${esc(s.sub)}</div>`:""}
      </div></div>`;
    case "stat": return `
      <div class="body"><div>
        <div class="stat-value">${esc(s.value)}</div>
        ${s.label?`<div class="stat-label">${esc(s.label)}</div>`:""}
        ${s.note?`<div class="stat-note">${esc(s.note)}</div>`:""}
      </div></div>`;
    case "list": return `
      <div class="body"><div>
        <h1 class="headline">${esc(s.headline)}</h1>
        <div class="cards">${(s.items||[]).map(i=>`
          <div class="card"><div class="card-title">${esc(i.title)}</div>
          ${i.detail?`<div class="card-detail">${esc(i.detail)}</div>`:""}</div>`).join("")}</div>
      </div></div>`;
    case "steps": return `
      <div class="body"><div>
        <h1 class="headline">${esc(s.headline)}</h1>
        <div class="steps">${(s.steps||[]).map((t,i)=>`
          <div class="step"><div class="n">${i+1}</div><div class="t">${esc(t)}</div></div>`).join("")}</div>
      </div></div>`;
    case "quote": return `
      <div class="body"><div class="quote-body">
        <div class="quote">${esc(s.quote)}</div>
        <div class="attrib"><span class="avatar"${s.avatar?` style="background-image:url('${esc(s.avatar)}')"`:""}></span>
          <div><div class="who">${esc(s.name)}</div><div class="role">${esc(s.role)}</div></div></div>
      </div></div>`;
    case "cta": return `
      <div class="body"><div>
        <h1 class="headline">${esc(s.headline)}</h1>
        ${s.sub?`<div class="sub">${esc(s.sub)}</div>`:""}
        <div class="cta-btn">${esc(s.action||"Book a consultation")} ${icon(ICON.arrow)}</div>
        ${s.url?`<div class="cta-url">${esc(s.url)}</div>`:""}
      </div></div>`;
    default: return `<div class="body"><div class="headline">Unknown panel: ${esc(s.type)}</div></div>`;
  }
}

function renderDeck(){
  const deck = window.DECK || {};
  const [w,h] = String(deck.size||"1080x1350").split("x").map(Number);
  const handle = deck.handle || "maintainaudits.com.au";
  const el = document.getElementById("deck");
  el.innerHTML = (deck.slides||[]).map((s,i)=>{
    const bg = resolveBg(s.bg);
    const tone = s.tone || (bg && bg.tone) || "dark";
    const cls = bg ? "stage has-bg" : "stage";
    return `<section class="${cls}" data-tone="${tone}" data-i="${i+1}" style="${bg?`background-image:url('${bg.src}');`:""}width:${w}px;height:${h}px">
      <div class="brandbar">${wordmark()}${s.kicker?`<span class="kicker">${esc(s.kicker)}</span>`:"<span></span>"}</div>
      ${panelBody(s)}
      <div class="footer"><span>${esc(handle)}</span><span class="idx">${i+1} / ${deck.slides.length}</span></div>
    </section>`;
  }).join("");
  return (deck.slides||[]).length;
}
window.renderDeck = renderDeck;
renderDeck();
</script>
</body>
</html>
